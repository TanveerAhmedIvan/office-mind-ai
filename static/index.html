<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OfficeMind AI</title>
<style>body{font:16px system-ui;max-width:760px;margin:0 auto;padding:16px;display:flex;flex-direction:column;height:100vh;box-sizing:border-box}
#log{flex:1;overflow:auto}.m{margin:8px 0;padding:10px 12px;border-radius:10px;white-space:pre-wrap}
.u{background:#e8f0fe;margin-left:15%}.b{background:#f1f3f4;margin-right:15%}.s{font-size:12px;color:#555;margin-top:6px}
form{display:flex;gap:8px}input{flex:1;padding:10px;font-size:16px}button{padding:10px 16px}</style></head><body>
<h2>OfficeMind AI — Nodi Tech</h2><div id="log"></div>
<form id="f"><input id="q" placeholder="Ask about HR, IT, expenses, NodiDesk…" autocomplete="off" autofocus><button>Send</button></form>
<script>
let sid=null;const log=document.getElementById('log');
function add(c,t){const d=document.createElement('div');d.className='m '+c;d.textContent=t;log.append(d);log.scrollTop=1e9;return d}
f.onsubmit=async e=>{e.preventDefault();const m=q.value.trim();if(!m)return;q.value='';add('u',m);
const b=add('b','…');let txt='';const s=document.createElement('div');s.className='s';
const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,session_id:sid})});
const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
while(true){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});
let i;while((i=buf.indexOf('\n\n'))>=0){const blk=buf.slice(0,i);buf=buf.slice(i+2);
const ev=blk.match(/event: (\w+)/)[1],data=JSON.parse(blk.match(/data: (.*)/)[1]);
if(ev==='meta'){sid=data.session_id;s.textContent='Sources: '+data.sources.join(', ');}
if(ev==='token'){txt+=data;b.textContent=txt;log.scrollTop=1e9}}}
b.append(s)};
</script></body></html>
