<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Change password · OfficeMind</title>
<style>
:root{--bg:#fff;--fg:#1d2433;--mut:#5b6577;--card:#f4f6fa;--line:#d5dbe6;--acc:#2557d6;--err:#c0392b;--ok:#0f8a5f}
@media(prefers-color-scheme:dark){:root{--bg:#12151c;--fg:#e6e9f0;--mut:#9aa3b5;--card:#1b2030;--line:#2e3650;--acc:#7aa2ff;--err:#ff8a7a;--ok:#4cd3a0}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;display:flex;justify-content:center;padding:32px 16px}
main{width:100%;max-width:380px}h1{font-size:22px;margin:0 0 4px}p.s{color:var(--mut);margin:0 0 18px;font-size:14px}
form{display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
input{padding:10px 12px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
button{padding:11px;border:0;border-radius:10px;background:var(--acc);color:#fff;font-size:16px;cursor:pointer}button:disabled{opacity:.5}
#msg{min-height:22px;font-size:14px}.err{color:var(--err)}.ok{color:var(--ok)}a{color:var(--acc);font-size:14px}
.rules{font-size:12.5px;color:var(--mut);margin:-4px 0 0}
</style></head><body><main>
<p style="margin:0 0 12px"><a href="/">← Back to chat</a></p>
<h1>Change password</h1><p class="s" id="who">&nbsp;</p>
<form id="f">
<label>Current password<input id="o" type="password" autocomplete="current-password" required></label>
<label>New password<input id="n" type="password" autocomplete="new-password" minlength="8" required></label>
<label>Confirm new password<input id="c" type="password" autocomplete="new-password" minlength="8" required></label>
<div class="rules">At least 8 characters. Don't reuse the default password.</div>
<button id="go">Change password</button><div id="msg" role="status"></div>
</form>
<script>
const $=id=>document.getElementById(id);
fetch('/me').then(r=>r.ok?r.json():Promise.reject()).then(m=>$('who').textContent='Signed in as '+m.email).catch(()=>location.href='/');
$('f').onsubmit=async e=>{e.preventDefault();const m=$('msg');m.className='';m.textContent='';
 if($('n').value.length<8){m.className='err';m.textContent='New password must be at least 8 characters.';return}
 if($('n').value!==$('c').value){m.className='err';m.textContent='The new passwords do not match.';return}
 if($('n').value===$('o').value){m.className='err';m.textContent='The new password must be different from the current one.';return}
 $('go').disabled=true;
 try{const r=await fetch('/me/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({old_password:$('o').value,new_password:$('n').value})});
  if(r.status===401){location.href='/';return}
  const j=await r.json().catch(()=>({}));
  if(!r.ok){m.className='err';m.textContent=j.detail||'Could not change the password.';$('go').disabled=false;return}
  m.className='ok';m.textContent='Password changed. Signing you out…';await fetch('/logout',{method:'POST'});setTimeout(()=>location.href='/',1200)
 }catch(x){m.className='err';m.textContent='Could not reach the server.';$('go').disabled=false}};
</script></main></body></html>
